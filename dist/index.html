    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaunchTracker | Live Rocket Launch Dashboard</title>
    <meta
      name="description"
      content="Live dashboard for upcoming rocket launches worldwide with mission details and a real-time countdown."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>

    <header class="hero">
      <p class="kicker">Mission Control</p>
      <h1>Global Rocket Launch Monitor</h1>
      <p class="subtitle">
        Tracking real upcoming launches worldwide. Data refreshes automatically and the
        next mission countdown updates every second.
      </p>
    </header>

    <main class="layout">
      <section class="next-launch panel" aria-labelledby="next-launch-title">
        <div class="panel-head">
          <h2 id="next-launch-title">Next Launch</h2>
          <p id="updated-at" class="muted">Updating...</p>
        </div>

        <div id="next-launch-content" class="next-launch-content" aria-live="polite">
          <p class="loading">Fetching launch telemetry...</p>
        </div>
      </section>

      <section class="upcoming panel" aria-labelledby="upcoming-title">
        <div class="panel-head">
          <h2 id="upcoming-title">Upcoming Missions</h2>
          <p class="muted">Live feed</p>
        </div>

        <div id="launch-list" class="launch-list" aria-live="polite">
          <p class="loading">Preparing mission queue...</p>
        </div>
      </section>
    </main>

    <template id="launch-card-template">
      <article class="launch-card">
        <div class="mission-line">
          <h3 class="mission-name"></h3>
          <span class="tag rocket-tag"></span>
        </div>

        <p class="launch-time"></p>
        <p class="launch-site"></p>
      </article>
    </template>
